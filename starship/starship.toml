"$schema" = 'https://starship.rs/config-schema.json'

# Converted from oh-my-posh (config.omp.json). Two-line prompt:
#   line 1:  aws  terraform  conda  python  git-branch
#   line 2:  path
add_newline = false
command_timeout = 1000

format = """\
${custom.aws}\
${custom.terraform}\
$conda\
$python\
$git_branch\
$git_status\
$line_break\
$directory\
$character"""

palette = "catppuccin_mocha"

# ── line 1 ──────────────────────────────────────────────────────────────────

# oh-my-posh aws segment reproduced faithfully:  profile@region, always shown.
# starship's built-in aws can't emit the literal "default" when AWS_* is unset, so
# mirror oh-my-posh: profile = $AWS_VAULT/$AWS_PROFILE or "default"; region =
# $AWS_REGION/$AWS_DEFAULT_REGION or the profile's region from ~/.aws/config.
[custom.aws]
command = '''
p="${AWS_VAULT:-${AWS_PROFILE:-default}}"
r="${AWS_REGION:-$AWS_DEFAULT_REGION}"
if [ -z "$r" ]; then
  r=$(awk -v p="$p" 'BEGIN{sec=(p=="default")?"[default]":"[profile " p "]"} $0==sec{f=1;next} /^\[/{f=0} f&&/^[ \t]*region[ \t]*=/{sub(/^[^=]*=[ \t]*/,"");print;exit}' "${AWS_CONFIG_FILE:-$HOME/.aws/config}")
fi
if [ -n "$r" ]; then printf '%s@%s' "$p" "$r"; else printf '%s' "$p"; fi
'''
when = true
shell = ["bash", "--noprofile", "--norc"]
format = '[  $output ]($style)'
style = "blue"

# oh-my-posh command segment running ~/bin/tf-version.sh (white text). The script
# prints " 󱁢 <version>" only inside a terraform dir and is silent otherwise.
[custom.terraform]
command = "$HOME/bin/tf-version.sh"
when = true
shell = ["bash", "--noprofile", "--norc"]
format = '[$output]($style)'
style = "white"

# oh-my-posh: "(conda){{env}}" unless env is base. starship hides base by default.
[conda]
format = '[\(conda\)$environment ]($style)'
style = "#ababab"
disabled = false

# oh-my-posh python: "  {{ .Full }} ", foreground #AABB00 (olive)
[python]
symbol = " "
format = '[$symbol$version ]($style)'
style = "#AABB00"
disabled = false

# oh-my-posh git: branch/HEAD, plus working/staging status,
# branch_icon " ", foreground lavender.
[git_branch]
symbol = " "
format = '[$symbol$branch ]($style)'
style = "lavender"
disabled = false

# Working/staging status (matches oh-my-posh fetch_status:true).
[git_status]
style = "yellow"
disabled = false

# ── line 2 ──────────────────────────────────────────────────────────────────

# oh-my-posh path: pink, home as ~, full-ish path.
[directory]
style = "pink"
truncate_to_repo = false
truncation_length = 5
truncation_symbol = "…/"
home_symbol = "~"
disabled = false

# oh-my-posh closer: "" () in the "os" grey (#ACB0BE). Red on error is a
# small enhancement over omp's always-grey chevron.
[character]
success_symbol = '[](#acb0be)'
error_symbol = '[](red)'
disabled = false

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ── everything else off (single source of truth for the two lines above) ──────
[kubernetes]
disabled = true
[nodejs]
disabled = true
[terraform]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true
[username]
disabled = true
[hostname]
disabled = true
[cmd_duration]
disabled = true
[time]
disabled = true
[status]
disabled = true
[battery]
disabled = true
[jobs]
disabled = true
